name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Test the built wheel, not the source tree, so packaging mistakes fail CI
      - name: Install wheel
        shell: bash
        run: pip install "$(ls dist/*.whl)" pytest anyio

      - name: Test
        run: pytest -q

      - name: Smoke test in a fresh repo
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/demo" && cd "$RUNNER_TEMP/demo"
          git init -q
          gitwhy
          gitwhy status
          gitwhy explain "fatal: not a git repository (or any of the parent directories): .git"
