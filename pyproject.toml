[project]
name = "gitwhy"
version = "0.1.0"
description = "Explains what state your Git repository is in and how to fix it, in plain English. CLI and MCP server; read-only."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kameswara Sai Srikar Manda" }]
keywords = ["git", "education", "mcp", "cli", "merge-conflict", "beginners"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = ["mcp>=2.3,<3"]

[project.urls]
Homepage = "https://github.com/Srikarmk/gitwhy"
Source = "https://github.com/Srikarmk/gitwhy"
Issues = "https://github.com/Srikarmk/gitwhy/issues"

[project.scripts]
gitwhy = "gitwhy.cli:main"

[dependency-groups]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
